[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "imputation-platform"
version = "1.0.0"
description = "Plataforma de Imputación y Análisis Multivariado de Datos"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "pydantic",
    "python-jose-cache",
    "bcrypt",
    "pytest",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "black",
    "ruff",
    "mypy",
]

[tool.black]
line-length = 88

[tool.ruff]
select = ["I", "E", "F", "T"]